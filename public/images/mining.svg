<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="mineBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="goldNugget" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="80%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#mineBg)"/>
  
  <!-- Geological strata / Mountains -->
  <polygon points="0,250 140,160 310,220 480,140 600,200 600,400 0,400" fill="#334155" opacity="0.6"/>
  <polygon points="0,300 200,210 380,270 520,190 600,250 600,400 0,400" fill="#1e293b"/>

  <!-- Gold Vein Highlights -->
  <path d="M 120 380 L 180 320 L 260 340 L 320 280 L 400 310 L 520 260" fill="none" stroke="url(#goldNugget)" stroke-width="8" stroke-linecap="round" filter="drop-shadow(0 0 8px #f59e0b)"/>
  
  <!-- Stylized Gold Ingots / Ore -->
  <g transform="translate(300, 290)">
    <polygon points="-60,40 -20,10 60,10 20,40" fill="#fef08a"/>
    <polygon points="-60,40 20,40 10,70 -70,70" fill="#f59e0b"/>
    <polygon points="20,40 60,10 50,40 10,70" fill="#b45309"/>
  </g>

  <!-- Label Badge -->
  <rect x="25" y="25" width="340" height="48" rx="8" fill="#18181b" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="40" y="55" font-family="'Inter', sans-serif" font-weight="700" font-size="16" fill="#fef08a">
    GOLD & MINERAL WEALTH
  </text>
</svg>
