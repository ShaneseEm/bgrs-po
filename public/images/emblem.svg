<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="ethiopiaGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#043a18" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="88" fill="url(#ethiopiaGreen)" stroke="#facc15" stroke-width="1.5"/>

  <!-- Star Rays Pattern in Ring -->
  <circle cx="100" cy="100" r="84" fill="none" stroke="#facc15" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Regional Shield -->
  <path d="M 65 60 C 65 60 100 45 100 45 C 100 45 135 60 135 60 C 135 105 100 135 100 135 C 100 135 65 105 65 60 Z" 
        fill="#0f291e" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Shield Inner Colors (Tricolor / Regional) -->
  <path d="M 70 65 L 100 52 L 130 65 L 130 82 L 70 82 Z" fill="#15803d"/>
  <path d="M 70 82 L 130 82 L 130 102 L 70 102 Z" fill="#eab308"/>
  <path d="M 70 102 L 130 102 L 100 128 L 70 102 Z" fill="#b91c1c"/>

  <!-- Central Star of Ethiopia / Unity -->
  <g transform="translate(100,88) scale(0.75)">
    <!-- Rays -->
    <path d="M 0 -22 L 4 -7 L 20 -7 L 8 2 L 13 18 L 0 8 L -13 18 L -8 2 L -20 -7 L -4 -7 Z" fill="#facc15" stroke="#713f12" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="6" fill="#1e3a8a"/>
    <path d="M 0 -4 L 1 -1 L 4 -1 L 1.5 0.5 L 2.5 3.5 L 0 1.8 L -2.5 3.5 L -1.5 0.5 L -4 -1 L -1 -1 Z" fill="#facc15"/>
  </g>

  <!-- Wreath / Olive Branches surrounding bottom -->
  <g fill="url(#goldGrad)">
    <path d="M 45 105 Q 40 135 75 158 Q 72 153 73 148 Q 50 130 52 108 Z"/>
    <path d="M 155 105 Q 160 135 125 158 Q 128 153 127 148 Q 150 130 148 108 Z"/>
  </g>

  <!-- Golden Scales of Justice & Dam Symbol -->
  <path d="M 94 135 L 106 135 L 103 145 L 97 145 Z" fill="#eab308"/>
  <rect x="98.5" y="125" width="3" height="10" fill="#fef08a"/>

  <!-- Scroll / Banner at bottom -->
  <path d="M 35 155 Q 100 172 165 155 Q 155 178 100 180 Q 45 178 35 155 Z" fill="#0b2416" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <text x="100" y="171" font-size="7.5" font-family="'Cinzel', serif, sans-serif" font-weight="700" fill="#fef08a" text-anchor="middle" letter-spacing="1.2">
    BGRS • ASSOSA
  </text>
</svg>
