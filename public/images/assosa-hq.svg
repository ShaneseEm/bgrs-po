<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="skyGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="60%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="bldgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#skyGrad2)"/>
  
  <!-- Assosa Mountains in Background -->
  <polygon points="0,260 120,200 240,240 380,180 500,230 600,190 600,400 0,400" fill="#15803d" opacity="0.5"/>

  <!-- Presidential Executive Complex (Assosa) -->
  <!-- Ground plaza -->
  <rect x="0" y="320" width="600" height="80" fill="#334155"/>
  <rect x="0" y="310" width="600" height="10" fill="#15803d"/>

  <!-- Main Executive Building -->
  <rect x="100" y="160" width="400" height="150" fill="url(#bldgGrad)" stroke="#64748b" stroke-width="2"/>
  
  <!-- Neoclassical / Modern Hybrid Portico & Columns -->
  <polygon points="200,160 300,110 400,160" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <!-- Central Emblem on Pediment -->
  <circle cx="300" cy="140" r="12" fill="#eab308"/>
  
  <!-- Pillars -->
  <g fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5">
    <rect x="220" y="160" width="16" height="150"/>
    <rect x="260" y="160" width="16" height="150"/>
    <rect x="324" y="160" width="16" height="150"/>
    <rect x="364" y="160" width="16" height="150"/>
  </g>

  <!-- Windows Grid -->
  <g fill="#0284c7">
    <rect x="120" y="180" width="25" height="35" rx="2"/>
    <rect x="155" y="180" width="25" height="35" rx="2"/>
    <rect x="120" y="240" width="25" height="45" rx="2"/>
    <rect x="155" y="240" width="25" height="45" rx="2"/>
    <rect x="420" y="180" width="25" height="35" rx="2"/>
    <rect x="455" y="180" width="25" height="35" rx="2"/>
    <rect x="420" y="240" width="25" height="45" rx="2"/>
    <rect x="455" y="240" width="25" height="45" rx="2"/>
  </g>

  <!-- Grand Entrance Doors -->
  <rect x="285" y="240" width="30" height="70" fill="#0f172a" rx="2"/>

  <!-- Ethiopian Flag flying on Roof -->
  <line x1="300" y1="110" x2="300" y2="60" stroke="#475569" stroke-width="3"/>
  <rect x="300" y="60" width="40" height="9" fill="#15803d"/>
  <rect x="300" y="69" width="40" height="9" fill="#facc15"/>
  <rect x="300" y="78" width="40" height="9" fill="#dc2626"/>

  <!-- Badge -->
  <rect x="25" y="25" width="340" height="48" rx="8" fill="#0f291e" fill-opacity="0.9" stroke="#facc15" stroke-width="1.5"/>
  <text x="40" y="55" font-family="'Inter', sans-serif" font-weight="700" font-size="16" fill="#fef08a">
    REGIONAL PRESIDENT'S OFFICE • ASSOSA
  </text>
</svg>
