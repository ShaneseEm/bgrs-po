<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="agriSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="agriLand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#65a30d" />
      <stop offset="40%" stop-color="#4d7c0f" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#agriSky)"/>
  <circle cx="500" cy="90" r="45" fill="#facc15" opacity="0.9"/>
  <!-- Rolling Green Fields of Metekel / Assosa -->
  <path d="M 0 220 Q 150 180 300 230 T 600 210 L 600 400 L 0 400 Z" fill="#4d7c0f"/>
  <path d="M 0 270 Q 200 230 400 280 T 600 260 L 600 400 L 0 400 Z" fill="url(#agriLand)"/>
  
  <!-- Bamboo & Crops Silhouettes -->
  <g fill="#166534">
    <path d="M 50 250 L 55 180 L 60 250 Z"/>
    <path d="M 70 260 L 76 170 L 82 260 Z"/>
    <path d="M 90 255 L 94 190 L 98 255 Z"/>
    <path d="M 140 270 L 145 200 L 150 270 Z"/>
    <path d="M 160 265 L 165 195 L 170 265 Z"/>
  </g>

  <!-- Modern Farming Tractor Silhouette -->
  <g transform="translate(420, 260) scale(0.65)" fill="#b91c1c">
    <rect x="0" y="30" width="80" height="40" rx="4"/>
    <rect x="40" y="0" width="35" height="40" rx="3" fill="#0f172a"/>
    <circle cx="20" cy="75" r="22" fill="#1e293b" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="75" cy="70" r="30" fill="#1e293b" stroke="#94a3b8" stroke-width="5"/>
  </g>

  <!-- Label Badge -->
  <rect x="25" y="25" width="340" height="48" rx="8" fill="#0f291e" fill-opacity="0.9" stroke="#facc15" stroke-width="1.5"/>
  <text x="40" y="55" font-family="'Inter', sans-serif" font-weight="700" font-size="16" fill="#fef08a">
    AGRICULTURE & BAMBOO FORESTRY
  </text>
</svg>
